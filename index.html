<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visita medica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Prenota l’orario della visita medica sportiva o della nutrizionista. ASD Power Gym Passignano e TrasimenoFlippers.">
<title>Visita Medica Sportiva</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* ── Colori di sistema iOS (Human Interface Guidelines) ───────────── */
  :root {
    --bg:            #F2F2F7;
    --card:          #FFFFFF;
    --sfondo-foglio: #F2F2F7;
    --card-foglio:   #FFFFFF;
    --fill:          rgba(120,120,128,.12);
    --fill-2:        rgba(120,120,128,.20);
    --label:         #000000;
    --label-2:       rgba(60,60,67,.60);
    --label-3:       rgba(60,60,67,.30);
    --sep:           rgba(60,60,67,.20);
    --tint:          #007AFF;
    --tint-soft:     rgba(0,122,255,.10);
    --tint-focus:    rgba(0,122,255,.45);
    --green:         #34C759;
    --green-text:    #248A3D;
    --red:           #FF3B30;
    --red-soft:      rgba(255,59,48,.10);
    --orange:        #FF9500;
    --pg:            #E5484D;
    --tf:            #FF9500;
    --nav:           rgba(242,242,247,.78);
    --hud:           rgba(255,255,255,.94);
    --veil:          rgba(0,0,0,.28);
    --ombra-card:    0 1px 2px rgba(0,0,0,.04);
    --segmento:      #FFFFFF;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:            #000000;
      --card:          #1C1C1E;
      --sfondo-foglio: #1C1C1E;
      --card-foglio:   #2C2C2E;
      --fill:          rgba(118,118,128,.24);
      --fill-2:        rgba(118,118,128,.34);
      --label:         #FFFFFF;
      --label-2:       rgba(235,235,245,.60);
      --label-3:       rgba(235,235,245,.30);
      --sep:           rgba(84,84,88,.60);
      --tint:          #0A84FF;
      --tint-soft:     rgba(10,132,255,.18);
      --tint-focus:    rgba(10,132,255,.55);
      --green:         #30D158;
      --green-text:    #30D158;
      --red:           #FF453A;
      --red-soft:      rgba(255,69,58,.16);
      --orange:        #FF9F0A;
      --pg:            #FF6369;
      --tf:            #FF9F0A;
      --nav:           rgba(0,0,0,.72);
      --hud:           rgba(44,44,46,.94);
      --veil:          rgba(0,0,0,.55);
      --ombra-card:    none;
      --segmento:      #636366;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  html.bloccato, html.bloccato body { overflow: hidden; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.29;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--tint-focus); outline-offset: 2px; border-radius: 10px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ── Barra di navigazione traslucida ──────────────────────────────── */
  .nav {
    position: sticky;
    top: 0;
    z-index: 20;
    padding-top: env(safe-area-inset-top);
    transition: background-color .2s, box-shadow .2s;
  }
  .nav.solida {
    background: var(--nav);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    box-shadow: 0 .5px 0 var(--sep);
  }
  .nav-inner {
    max-width: 680px;
    height: 44px;
    margin: 0 auto;
    padding: 0 8px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  .nav-indietro {
    justify-self: start;
    display: flex;
    align-items: center;
    gap: 5px;
    height: 44px;
    padding: 0 8px;
    border: 0;
    background: none;
    color: var(--tint);
    font-size: 17px;
    cursor: pointer;
  }
  .nav-indietro svg { width: 12px; height: 21px; }
  .nav-titolo {
    grid-column: 2;
    font-weight: 600;
    font-size: 17px;
    max-width: 58vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transition: opacity .2s;
  }
  .nav.solida .nav-titolo { opacity: 1; }
  .nav-destra { grid-column: 3; justify-self: end; display: flex; align-items: center; padding: 0 8px; }

  /* ── Pagina ───────────────────────────────────────────────────────── */
  .pagina {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  }

  .testata { padding: 2px 4px 6px; }
  .sopratitolo {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--label-2);
    min-height: 18px;
  }
  .titolo-grande {
    margin: 2px 0 0;
    font-size: 34px;
    line-height: 41px;
    font-weight: 700;
    letter-spacing: -.012em;
    text-wrap: balance;
  }
  .titolo-grande::first-letter { text-transform: uppercase; }
  .sottotitolo {
    margin: 4px 0 0;
    font-size: 15px;
    line-height: 20px;
    color: var(--label-2);
  }
  .testata-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
  .testata-extra:empty { display: none; }

  .capsula {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    background: var(--fill);
    font-size: 13px;
    font-weight: 600;
    color: var(--label);
  }
  .capsula.staff { background: var(--tint-soft); color: var(--tint); }

  .punto { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

  .loghi { display: flex; gap: 10px; }
  .stemma {
    display: block;
    height: 40px;
    width: auto;
    max-width: 112px;
    padding: 4px 7px;
    border-radius: 9px;
    background: #fff;
    object-fit: contain;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.08);
  }

  /* ── Liste raggruppate (come Impostazioni) ────────────────────────── */
  .sezione {
    margin: 26px 16px 7px;
    font-size: 13px;
    line-height: 18px;
    text-transform: uppercase;
    color: var(--label-2);
  }
  .nota-sezione {
    margin: 7px 16px 0;
    font-size: 13px;
    line-height: 18px;
    color: var(--label-2);
  }
  .nota-sezione.centrata { text-align: center; }

  .gruppo {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--ombra-card);
  }

  .riga {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 44px;
    padding: 11px 16px;
    border: 0;
    background: none;
    text-align: left;
    text-decoration: none;
    color: var(--label);
  }
  .riga + .riga::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: var(--rientro, 16px);
    height: .5px;
    background: var(--sep);
  }
  button.riga, a.riga { cursor: pointer; }
  button.riga:active:not(:disabled), a.riga:active { background: var(--fill); }
  button.riga:disabled { cursor: default; }

  .riga-testo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .riga-titolo { font-size: 17px; line-height: 22px; }
  .riga-titolo.spento { color: var(--label-3); }
  .riga-sotto {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 1px;
    font-size: 15px;
    line-height: 20px;
    color: var(--label-2);
  }
  .riga-valore { font-size: 17px; color: var(--label-2); font-variant-numeric: tabular-nums; }
  .riga-ora {
    width: 50px;
    flex: none;
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .riga-ora.spento { color: var(--label-3); font-weight: 400; }
  .riga.azione { color: var(--tint); }
  .riga.distruttiva { justify-content: center; color: var(--red); }

  .chevron { width: 8px; height: 13px; flex: none; color: var(--label-3); display: flex; }
  .chevron svg { width: 8px; height: 13px; }

  .icona {
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 7px;
    display: grid;
    place-items: center;
    color: #fff;
  }
  .icona svg { width: 18px; height: 18px; }
  .icona.blu    { background: #007AFF; }
  .icona.verde  { background: #34C759; }
  .icona.grigia { background: #8E8E93; }
  .icona.indaco { background: #5856D6; }
  .icona.arancio{ background: #FF9500; }
  .icona.rossa  { background: #FF3B30; }

  /* Anello stile Attività: quanta parte della serata è ancora libera */
  .anello { width: 36px; height: 36px; flex: none; }
  .anello .traccia { fill: none; stroke: var(--fill-2); stroke-width: 3.5; }
  .anello .progresso { fill: none; stroke-width: 3.5; stroke-linecap: round; }
  .anello text {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    fill: var(--label);
    text-anchor: middle;
    dominant-baseline: central;
  }

  /* Interruttore iOS */
  .interruttore { position: relative; width: 51px; height: 31px; flex: none; }
  .interruttore input { position: absolute; inset: 0; z-index: 1; margin: 0; opacity: 0; cursor: pointer; }
  .interruttore input:disabled { cursor: default; }
  .interruttore .binario {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: var(--fill-2);
    transition: background-color .2s;
  }
  .interruttore .pomello {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16);
    transition: transform .25s cubic-bezier(.3,.7,.4,1);
  }
  .interruttore input:checked ~ .binario { background: var(--green); }
  .interruttore input:checked ~ .pomello { transform: translateX(20px); }
  .interruttore input:disabled ~ * { opacity: .5; }
  .interruttore input:focus-visible ~ .binario { outline: 3px solid var(--tint-focus); outline-offset: 2px; }

  /* ── Orari a pastiglie ────────────────────────────────────────────── */
  .orari {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  @media (min-width: 540px) { .orari { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .orario {
    height: 62px;
    border: 0;
    border-radius: 14px;
    background: var(--card);
    color: var(--tint);
    box-shadow: var(--ombra-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: transform .12s ease-out;
  }
  .orario:active:not(:disabled) { transform: scale(.95); }
  .orario b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .orario small { font-size: 12px; font-weight: 500; }
  .orario.libero small { color: var(--green-text); }
  .orario.preso { background: var(--fill); color: var(--label-3); box-shadow: none; cursor: default; }
  .orario.preso b { text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .orario.mio { background: var(--tint); color: #fff; }
  .orario.mio small { color: rgba(255,255,255,.88); }
  .orario.fuori { background: var(--fill); color: var(--label-3); box-shadow: none; cursor: default; }

  /* ── Avvisi, stati vuoti, scheletri ───────────────────────────────── */
  .avviso {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-top: 18px;
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--card);
    font-size: 15px;
    line-height: 20px;
    color: var(--label);
  }
  .avviso .icona { width: 26px; height: 26px; border-radius: 13px; }
  .avviso .icona svg { width: 15px; height: 15px; }
  .avviso.info .icona { background: var(--tint); }

  .stato-vuoto { text-align: center; padding: 48px 24px 20px; }
  .stato-vuoto .icona { width: 56px; height: 56px; border-radius: 28px; margin: 0 auto 14px; background: var(--fill); color: var(--label-2); }
  .stato-vuoto .icona svg { width: 28px; height: 28px; }
  .stato-vuoto h3 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  .stato-vuoto p { margin: 0 auto 18px; max-width: 30ch; font-size: 15px; line-height: 20px; color: var(--label-2); }
  .stato-vuoto .btn { max-width: 220px; margin: 0 auto; }

  .scheletro { background: var(--fill); border-radius: 6px; animation: pulsa 1.3s ease-in-out infinite; }
  @keyframes pulsa { 50% { opacity: .45; } }

  .rotella {
    display: inline-block;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2.5px solid var(--fill-2);
    border-top-color: var(--label-2);
    animation: gira .75s linear infinite;
  }
  .rotella.chiara { width: 18px; height: 18px; border-color: rgba(255,255,255,.35); border-top-color: #fff; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* ── Pulsanti ─────────────────────────────────────────────────────── */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 14px;
    background: var(--tint);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: opacity .15s;
  }
  .btn:active:not(:disabled) { opacity: .72; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg { width: 20px; height: 20px; }
  .btn.secondario { background: var(--tint-soft); color: var(--tint); }
  .btn.distruttivo { background: var(--red-soft); color: var(--red); }
  .pila { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }

  .link {
    border: 0;
    background: none;
    padding: 10px 8px;
    color: var(--tint);
    font-size: 17px;
    cursor: pointer;
  }

  /* ── Fogli che salgono dal basso ──────────────────────────────────── */
  .velo {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: var(--veil);
    animation: appari .22s ease-out;
  }
  .foglio {
    --card: var(--card-foglio);
    width: 100%;
    max-width: 680px;
    max-height: calc(100vh - 36px);
    max-height: calc(100dvh - 36px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 6px 16px calc(28px + env(safe-area-inset-bottom));
    border-radius: 14px 14px 0 0;
    background: var(--sfondo-foglio);
    animation: sali .36s cubic-bezier(.32,.72,0,1);
  }
  .maniglia { width: 36px; height: 5px; margin: 0 auto 4px; border-radius: 3px; background: var(--fill-2); }
  .testa-foglio {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 44px;
    margin: 0 -8px 4px;
  }
  .testa-foglio h2 { grid-column: 2; margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
  .testa-foglio .link:first-child { justify-self: start; }
  .testa-foglio .link.forte { grid-column: 3; justify-self: end; font-weight: 600; }

  @media (min-width: 720px) {
    .velo { align-items: center; padding: 24px; }
    .foglio { max-width: 460px; border-radius: 16px; padding-bottom: 24px; animation: comparsa .28s cubic-bezier(.32,.72,0,1); }
    .maniglia { display: none; }
  }
  @keyframes appari   { from { opacity: 0; } }
  @keyframes sali     { from { transform: translateY(100%); } }
  @keyframes comparsa { from { opacity: 0; transform: scale(.96); } }

  .riepilogo { text-align: center; margin: 6px 0 4px; }
  .riepilogo-ora {
    font-size: 52px;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -.025em;
    font-variant-numeric: tabular-nums;
  }
  .riepilogo-data { margin-top: 4px; font-size: 15px; color: var(--label-2); }
  .riepilogo-data::first-letter { text-transform: uppercase; }

  /* Campi modulo in lista */
  .campo { position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 16px; }
  .campo + .campo::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: 16px;
    height: .5px;
    background: var(--sep);
  }
  .campo > span { width: 100px; flex: none; font-size: 17px; }
  .campo input, .campo select {
    flex: 1;
    min-width: 0;
    padding: 13px 0;
    border: 0;
    outline: none;
    background: none;
    color: var(--label);
    font: inherit;
    font-size: 17px;
  }
  .campo input::placeholder { color: var(--label-3); }
  .campo select {
    -webkit-appearance: none;
    appearance: none;
    color: var(--tint);
    text-align: right;
    text-align-last: right;
    cursor: pointer;
  }
  .campo:focus-within { box-shadow: inset 3px 0 0 var(--tint); }

  .errore-inline { margin: 12px 16px 0; font-size: 15px; line-height: 20px; color: var(--red); }

  /* Scelta della società: come l'aspetto Chiaro/Scuro in Impostazioni */
  .scelta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px 12px 14px;
    border-radius: 12px;
    background: var(--card);
  }
  .opzione {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 2px;
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--label);
  }
  .anteprima {
    display: grid;
    place-items: center;
    width: 100%;
    max-width: 150px;
    height: 72px;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.14);
    transition: box-shadow .15s;
  }
  .anteprima img { max-width: 84%; max-height: 52px; object-fit: contain; }
  .anteprima .sigla { font-weight: 800; font-size: 15px; }
  .opzione[aria-checked="true"] .anteprima { box-shadow: 0 0 0 3px var(--tint); }
  .opzione .nome { font-size: 13px; font-weight: 500; }
  .spunta {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--label-3);
    transition: background-color .15s, border-color .15s;
  }
  .spunta svg { width: 13px; height: 13px; color: #fff; opacity: 0; }
  .opzione[aria-checked="true"] .spunta { background: var(--tint); border-color: var(--tint); }
  .opzione[aria-checked="true"] .spunta svg { opacity: 1; }

  /* Esito prenotazione */
  .esito { text-align: center; padding: 18px 8px 0; }
  .esito .cerchio {
    display: grid;
    place-items: center;
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    animation: rimbalzo .45s cubic-bezier(.3,1.5,.5,1);
  }
  .esito .cerchio svg { width: 38px; height: 38px; }
  @keyframes rimbalzo { from { transform: scale(.4); opacity: 0; } }
  .esito h2 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .esito p { margin: 0; font-size: 17px; color: var(--label-2); }
  .esito p::first-letter { text-transform: uppercase; }
  .codice {
    margin: 22px 0 8px;
    padding: 16px;
    border-radius: 12px;
    background: var(--card);
    text-align: center;
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: .22em;
  }

  /* Scheda persona, stile Contatti */
  .persona { text-align: center; padding: 8px 0 4px; }
  .avatar {
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(180deg, #A5ABB8, #858994);
    color: #fff;
    font-size: 30px;
    font-weight: 600;
  }
  .persona h2 { margin: 0 0 8px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .persona .capsula { margin-bottom: 6px; }
  .persona p { margin: 0; font-size: 15px; color: var(--label-2); }
  .persona p::first-letter { text-transform: uppercase; }

  /* Scelta del servizio e del tipo di appuntamento: controllo segmentato di iOS */
  .segmenti {
    display: grid;
    grid-auto-columns: minmax(0, 1fr);
    grid-auto-flow: column;
    gap: 2px;
    padding: 2px;
    border-radius: 9px;
    background: var(--fill);
  }
  .segmenti.servizi { margin-top: 18px; }
  .segmento {
    height: 32px;
    padding: 0 6px;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--label);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: background-color .2s, box-shadow .2s;
  }
  .segmento[aria-checked="true"] {
    background: var(--segmento);
    font-weight: 600;
    box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
  }

  /* Suggerimenti di data */
  .suggerimenti { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 4px 0; }
  .pillola {
    height: 34px;
    padding: 0 14px;
    border: 0;
    border-radius: 17px;
    background: var(--card);
    color: var(--tint);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .pillola[aria-pressed="true"] { background: var(--tint); color: #fff; }

  /* QR */
  .qr {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    padding: 18px 16px 14px;
    border-radius: 12px;
    background: var(--card);
  }
  .qr-tela { padding: 10px; border-radius: 12px; background: #fff; line-height: 0; }
  .qr-tela img, .qr-tela canvas { display: block; }
  .qr-url { font-family: var(--mono); font-size: 12px; color: var(--label-2); word-break: break-all; text-align: center; }
  .qr-azioni { display: flex; gap: 8px; width: 100%; }
  .qr-azioni .btn { height: 40px; font-size: 15px; border-radius: 10px; }

  /* ── Messaggio in alto, stile notifica ────────────────────────────── */
  .flash {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    left: 50%;
    z-index: 90;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: min(440px, calc(100vw - 32px));
    padding: 12px 18px 12px 14px;
    border-radius: 18px;
    background: var(--hud);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    box-shadow: 0 10px 30px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.06);
    font-size: 15px;
    font-weight: 500;
    line-height: 20px;
    color: var(--label);
    transform: translate(-50%, calc(-100% - 24px));
    transition: transform .4s cubic-bezier(.32,.72,0,1);
    pointer-events: none;
  }
  .flash.visibile { transform: translate(-50%, 0); }
  .flash .icona { width: 24px; height: 24px; border-radius: 12px; }
  .flash .icona svg { width: 14px; height: 14px; }
  .flash.ok .icona { background: var(--green); }
  .flash.avviso .icona { background: var(--orange); }

  /* Avviso di attesa lunga, in basso */
  .lento {
    position: fixed;
    left: 50%;
    top: calc(env(safe-area-inset-top) + 10px);
    z-index: 80;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 10px 12px;
    border-radius: 999px;
    background: var(--hud);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    box-shadow: 0 8px 24px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06);
    font-size: 14px;
    font-weight: 500;
    color: var(--label-2);
    white-space: nowrap;
    transform: translate(-50%, calc(-100% - 24px));
    transition: transform .4s cubic-bezier(.32,.72,0,1);
    pointer-events: none;
  }
  .lento.visibile { transform: translate(-50%, 0); }
  .lento .rotella { width: 16px; height: 16px; border-width: 2px; }

  /* Invito a installare l'app, stile scheda App Store */
  .installa {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-top: 28px;
    padding: 16px 48px 16px 16px;
    border-radius: 14px;
    background: var(--card);
    box-shadow: var(--ombra-card);
  }
  .installa-icona {
    width: 56px;
    height: 56px;
    flex: none;
    border-radius: 13px;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.10);
  }
  .installa-testo strong { display: block; font-size: 17px; line-height: 22px; font-weight: 600; }
  .installa-testo p { margin: 3px 0 0; font-size: 15px; line-height: 20px; color: var(--label-2); }
  .ico-inline { display: inline-flex; vertical-align: -3px; color: var(--tint); }
  .ico-inline svg { width: 18px; height: 18px; }
  .installa .btn { width: auto; height: 34px; margin-top: 10px; padding: 0 18px; border-radius: 17px; font-size: 15px; }
  .installa-chiudi {
    position: absolute;
    top: 10px;
    right: 10px;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: var(--fill);
    color: var(--label-2);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }

  /* ── Piè di pagina ────────────────────────────────────────────────── */
  .piede { margin-top: 40px; text-align: center; }
  .piede p { margin: 4px 0 0; font-size: 13px; color: var(--label-2); }

  @keyframes scuoti { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .scuoti { animation: scuoti .4s; }
</style>
</head>

/* ════════════════════════════════════════════════════════════════════
   Utilità
   ════════════════════════════════════════════════════════════════════ */
function $(id) { return document.getElementById(id); }

function el(tag, classe, testo) {
  var n = document.createElement(tag);
  if (classe) n.className = classe;
  if (testo != null) n.textContent = testo;
  return n;
}

function svuota(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

function icona(nome, classe) {
  var s = el('span', classe || 'icona');
  s.innerHTML = ICONE[nome];   /* solo SVG scritti qui sopra, mai dati degli utenti */
  return s;
}

function leggi(st, k) { try { return st.getItem(k) || ''; } catch (e) { return ''; } }
function scrivi(st, k, v) {
  try { if (v == null || v === '') st.removeItem(k); else st.setItem(k, v); } catch (e) {}
}

function maiuscola(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function due(n) { return ('0' + n).slice(-2); }

function oggiISO() {
  var d = new Date();
  return d.getFullYear() + '-' + due(d.getMonth() + 1) + '-' + due(d.getDate());
}

function etichettaData(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
}
function etichettaCorta(iso) {
  return maiuscola(new Date(iso + 'T12:00:00').toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }));
}

function plurale(n, uno, tanti) { return n + ' ' + (n === 1 ? uno : tanti); }

/* Durata degli appuntamenti della giornata aperta (la visita medica ha sempre la stessa) */
function durata() { return (S.slot && S.slot.durata) || (S.avvio && S.avvio.durata) || 15; }

function SV() { return SERVIZI[S.servizio]; }
function nutri() { return S.servizio === 'nutrizionista'; }
function servizioDi(d) { return d.servizio || 'medica'; }   /* le risposte salvate prima della nutrizionista non lo hanno */

/* Stessi slot che calcola il server: l'ultimo finisce entro l'ora di fine */
function minutiDi(hhmm) { var p = String(hhmm).split(':'); return +p[0] * 60 + +p[1]; }
function slotDi(o) {
  var out = [], fine = minutiDi(o.fine), d = +o.durata;
  if (!(d >= 5) || !o.inizio || !o.fine) return out;
  for (var m = minutiDi(o.inizio); m + d <= fine; m += d) out.push(due(Math.floor(m / 60)) + ':' + due(m % 60));
  return out;
}

function iniziali(nome, cognome) {
  return ((nome || '').charAt(0) + (cognome || '').charAt(0)).toUpperCase() || '?';
}

function stemma(canale) {
  var src = LOGHI && LOGHI[canale];
  if (!src) return null;
  var img = el('img', 'stemma');
  img.src = src;
  img.alt = CANALI[canale] || '';
  img.onerror = function () { img.remove(); };
  return img;
}

function puntoSocieta(canale) {
  var p = el('span', 'punto');
  p.style.background = COLORE[canale] || 'var(--label-3)';
  return p;
}

function errUtente(m) { var e = new Error(m); e.utente = true; return e; }
function testoErrore(e) {
  return (e && e.utente) ? e.message : 'Connessione assente. Controlla la rete e riprova.';
}

function occupa(b, attivo, testo) {
  if (attivo) {
    b.dataset.testo = b.textContent;
    b.disabled = true;
    svuota(b);
    var chiaro = !b.classList.contains('secondario') && !b.classList.contains('distruttivo');
    b.appendChild(el('span', 'rotella' + (chiaro ? ' chiara' : '')));
    if (testo) b.appendChild(document.createTextNode(testo));
  } else {
    b.disabled = false;
    if (b.dataset.testo != null) b.textContent = b.dataset.testo;
  }
}

/* Indicatore di attività in alto a destra; se l'attesa supera 5 secondi
   compare anche un avviso in basso, così nessuno pensa che sia bloccato. */
var inCorso = 0, inAttesa = 0, timerLento = null;
function carico(d, bloccante) {
  inCorso = Math.max(0, inCorso + d);
  if (bloccante) inAttesa = Math.max(0, inAttesa + d);
  $('rotella').hidden = inCorso === 0;
  if (inAttesa > 0 && !timerLento) {
    timerLento = setTimeout(function () { if (inAttesa > 0) $('lento').classList.add('visibile'); }, 5000);
  }
  if (inAttesa === 0) {
    clearTimeout(timerLento);
    timerLento = null;
    $('lento').classList.remove('visibile');
  }
}
/* Per le operazioni in cui l'utente aspetta davvero (un pulsante in attesa) */
function attendi(promessa) {
  carico(1, true);
  return promessa.then(function (v) { carico(-1, true); return v; }, function (e) { carico(-1, true); throw e; });
}

var timerFlash;
function flash(testo, tipo) {
  var f = $('flash');
  svuota(f);
  f.className = 'flash ' + (tipo || 'ok');
  f.appendChild(icona(tipo === 'avviso' ? 'avviso' : 'spunta'));
  f.appendChild(el('span', null, testo));
  requestAnimationFrame(function () { f.classList.add('visibile'); });
  clearTimeout(timerFlash);
  timerFlash = setTimeout(function () { f.classList.remove('visibile'); }, 2800);
}

function copiaTesto(testo) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(testo);
  return new Promise(function (ok, no) {
    var t = el('textarea');
    t.value = testo;
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy') ? ok() : no(); } catch (e) { no(e); }
    t.remove();
  });
}

/* ════════════════════════════════════════════════════════════════════
   Comunicazione con Google
   ════════════════════════════════════════════════════════════════════ */
var AZIONI = {
  apiAvvio: 'avvio', apiSlot: 'slot', apiPrenota: 'prenota', apiAnnulla: 'annulla',
  apiSposta: 'sposta', apiNuovaData: 'nuovaData', apiStatoData: 'statoData',
  apiEliminaData: 'eliminaData', apiElenco: 'elenco', apiOrariData: 'orariData'
};

function attesa(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }

/* Il tipo text/plain è voluto: con application/json il browser manderebbe prima
   una richiesta di controllo che Apps Script non sa gestire. Nome, cognome e
   telefono viaggiano nel corpo, mai nell’indirizzo.
   Google ogni tanto perde la risposta anche quando l’operazione è riuscita:
   ogni azione è ripetibile senza effetti doppi (il server riconosce la stessa
   richiesta), quindi riproviamo da soli fino a tre volte. */
/* Il nostro codice su Google risponde in 1–2 secondi, ma il passaggio intermedio
   di Google a volte resta appeso per 12 secondi e poi risponde 404.
   Rimedio: se un tentativo non risponde entro 4 secondi ne parte un secondo in
   parallelo (e dopo altri 4 un terzo); vince il primo che arriva. È sicuro
   perché ogni operazione è ripetibile: il server riconosce la stessa richiesta
   e non crea doppioni. */
var LIMITE_TENTATIVO_MS = 15000;
var RINFORZO_DOPO_MS = 4000;
var MAX_TENTATIVI = 3;

function tentativo(nome, dati) {
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, LIMITE_TENTATIVO_MS) : null;
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ azione: AZIONI[nome], dati: dati || {} }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (risposta) {
    clearTimeout(timer);
    return risposta;
  }, function (e) {
    clearTimeout(timer);
    throw e;
  });
}

function chiama(nome, dati) {
  return new Promise(function (ok, no) {
    var concluso = false, lanciati = 0, falliti = 0, rinforzo = null;

    function lancia() {
      if (concluso || lanciati >= MAX_TENTATIVI) return;
      lanciati++;
      tentativo(nome, dati).then(function (r) {
        if (concluso) return;
        concluso = true;
        clearTimeout(rinforzo);
        ok(r);
      }, function (e) {
        if (concluso) return;
        falliti++;
        if (falliti >= MAX_TENTATIVI) { concluso = true; clearTimeout(rinforzo); no(e); return; }
        /* Nessun tentativo più in volo: il prossimo parte subito */
        if (lanciati === falliti) { lancia(); programma(); }
      });
    }
    function programma() {
      clearTimeout(rinforzo);
      if (lanciati < MAX_TENTATIVI) rinforzo = setTimeout(function () { lancia(); programma(); }, RINFORZO_DOPO_MS);
    }

    lancia();
    programma();
  });
}

function conPin(d) { d = d || {}; if (S.pin) d.pin = S.pin; return d; }
/* Ogni richiesta su una giornata dice di quale servizio si parla */
function perServizio(d) { d = conPin(d); d.servizio = S.servizio; return d; }

function nuovoCodice() {
  var alfabeto = 'ACDEFGHJKLMNPQRTUVWXY3467', out = '', n = new Uint32Array(6);
  window.crypto.getRandomValues(n);
  for (var i = 0; i < 6; i++) out += alfabeto.charAt(n[i] % alfabeto.length);
  return out;
}

/* Le prenotazioni fatte da questo telefono: servono per riconoscerle e annullarle.
   Le visite mediche tengono la chiave di sempre, per non perdere quelle già fatte. */
function prefissoMie(data) { return 'mia:' + (nutri() ? S.servizio + ':' : '') + data + ':'; }
function chiaveMia(data, ora) { return prefissoMie(data) + ora; }
function salvaMia(data, ora, codice) { scrivi(localStorage, chiaveMia(data, ora), codice); }
function leggiMia(data, ora) { return leggi(localStorage, chiaveMia(data, ora)); }
function scordaMia(data, ora) { scrivi(localStorage, chiaveMia(data, ora), null); }
function mieDellaData(data) {
  var out = {}, prefisso = prefissoMie(data);
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(prefisso) === 0) out[k.slice(prefisso.length)] = localStorage.getItem(k);
    }
  } catch (e) {}
  return out;
}

function salvaCache(r) { try { localStorage.setItem(CHIAVE_CACHE, JSON.stringify(r)); } catch (e) {} }
function leggiCache() {
  try {
    var r = JSON.parse(localStorage.getItem(CHIAVE_CACHE));
    return r && r.ok && Array.isArray(r.date) ? r : null;
  } catch (e) { return null; }
}

   Intestazione

function intestazioneHome() {
  var a = S.avvio;
  $('sopratitolo').textContent = nutri()
    ? 'Consulenza nutrizionale'
    : (a ? 'Lunedì · ' + a.oraInizio + '–' + a.oraFine : 'Lunedì');
  $('titolo').textContent = SV().nome;
  $('nav-titolo').textContent = SV().nome;
  $('sottotitolo').textContent = S.admin
    ? 'Area staff: vedi i nomi e gestisci le date.'
    : 'Prenota il tuo orario in pochi secondi.';

  var extra = svuota($('testata-extra'));
  if (S.admin) {
    extra.appendChild(el('span', 'capsula staff', 'Staff'));
  } else if (CANALI[S.canale]) {
    var c = el('span', 'capsula');
    c.appendChild(puntoSocieta(S.canale));
    c.appendChild(document.createTextNode(CANALI[S.canale]));
    extra.appendChild(c);

function intestazioneGiorno(data, sotto) {

  $('nav-titolo').textContent = etichettaCorta(data);
  $('sottotitolo').textContent = sotto || 'Carico gli orari…';

}

function aggiornaPiede() {
  $('piede').hidden = false;
  $('btn-staff').textContent = S.admin ? 'Esci dall’area staff' : 'Area staff';
}

/* ════════════════════════════════════════════════════════════════════
   Schermata: elenco delle date
   ════════════════════════════════════════════════════════════════════ */
function applicaAvvio(r) {
  S.avvio = r;
  S.admin = !!r.admin;
  if (!S.admin && S.pin) { S.pin = ''; scrivi(sessionStorage, 'pin', null); }
  if (r.canali) CANALI = r.canali;
  if (r.loghi && Object.keys(r.loghi).length) LOGHI = r.loghi;
  if (!CANALI[S.canale]) {
    var salvato = leggi(localStorage, 'canale');
    S.canale = CANALI[PARAM_C] ? PARAM_C : (CANALI[salvato] ? salvato : '');
  }
  aggiornaPiede();
}

function aggiornaAvvio() {
  var turno = ++S.turnoAvvio;
  var bloccante = !S.avvio;
  carico(1, bloccante);
  return chiama('apiAvvio', conPin({ v: 3 })).then(function (r) {
    if (turno !== S.turnoAvvio) return;
    applicaAvvio(r);
    if (!r.admin) salvaCache(r);
    if (!S.giorno) mostraDate();
  }).catch(function () {
    if (turno !== S.turnoAvvio) return;
    if (!S.avvio) {
      mostraErrore('Non riesco a caricare le date', aggiornaAvvio);
    } else if (!S.giorno) {
      flash('Non riesco ad aggiornare: mostro gli ultimi dati.', 'avviso');
    }
  }).then(function () { carico(-1, bloccante); });
}

function mostraDate() {
  S.giorno = null;
  S.slot = null;
  intestazioneHome();
  var app = svuota($('app'));
  var a = S.avvio;

  /* Dalla memoria del telefono potrebbero arrivare date nel frattempo passate */
  var future = a.date.filter(function (d) { return S.admin || d.data >= oggiISO(); });
  var date = future.filter(function (d) { return servizioDi(d) === S.servizio; });

  /* Finché la nutrizionista non ha date, gli atleti non vedono la scelta */
  var conNutri = future.some(function (d) { return servizioDi(d) === 'nutrizionista'; });
  if (S.admin || conNutri || nutri()) app.appendChild(selettoreServizio());

  if (S.admin) app.appendChild(strumentiStaff());

  app.appendChild(el('div', 'sezione', S.admin ? 'Date in calendario' : 'Prossime date'));

  if (!date.length) {
    app.appendChild(statoVuoto('calendario',
      nutri() ? 'Nessuna data con la nutrizionista' : 'Nessuna data in programma',
      S.admin
        ? 'Aggiungi la prossima data da “' + SV().nuova + '”.'
        : 'Le nuove date compariranno qui. Riprova tra qualche giorno.'));
    aggiungiInvitoApp(app);
    return;
  }

  var g = el('div', 'gruppo');
  date.forEach(function (d) { g.appendChild(rigaData(d)); });
  app.appendChild(g);
  app.appendChild(el('p', 'nota-sezione', S.admin
    ? 'L’anello mostra quanta parte della ' + (nutri() ? 'giornata' : 'serata') + ' è ancora libera.'
    : 'Gli altri atleti non vedono il tuo nome: per loro l’orario risulta solo occupato.'));
  aggiungiInvitoApp(app);
}

/* Visita medica | Nutrizionista. La scelta finisce anche nell’indirizzo,
   così ricaricando la pagina si resta dove si era. */
function selettoreServizio() {
  var box = el('div', 'segmenti servizi');
  box.setAttribute('role', 'radiogroup');
  box.setAttribute('aria-label', 'Servizio');
  Object.keys(SERVIZI).forEach(function (k) {
    var b = el('button', 'segmento', SERVIZI[k].nome);
    b.type = 'button';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', k === S.servizio ? 'true' : 'false');
    b.onclick = function () { if (k !== S.servizio) scegliServizio(k); };
    box.appendChild(b);
  });
  return box;
}

function scegliServizio(k) {
  S.servizio = k;
  var q = new URLSearchParams(location.search);
  if (k === 'medica') q.delete('s'); else q.set('s', k);
  var qs = q.toString();
  try { history.replaceState(history.state, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
  if (S.avvio) mostraDate(); else { intestazioneHome(); scheletroDate(); }
}

/* ════════════════════════════════════════════════════════════════════
   App sul telefono
   Su Android Chrome propone da solo l’installazione: intercettiamo la
   proposta e la offriamo con un pulsante nostro. Su iPhone non esiste un
   pulsante: spieghiamo il gesto (Condividi → Aggiungi alla schermata Home).
   ════════════════════════════════════════════════════════════════════ */
var propostaInstallazione = null;

function eInstallata() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function eIPhone() {
  var ua = navigator.userAgent;
  return /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
}

function aggiungiInvitoApp(app) {
  if (eInstallata() || leggi(localStorage, 'invito-app-chiuso')) return;
  var iphone = eIPhone();
  if (!iphone && !propostaInstallazione) return;

  var box = el('div', 'installa');
  var img = el('img', 'installa-icona');
  img.src = 'apple-touch-icon.png';
  img.alt = '';
  box.appendChild(img);

  var t = el('div', 'installa-testo');
  t.appendChild(el('strong', null, 'Tienila sul telefono come un’app'));
  var p = el('p');
  if (iphone) {
    p.appendChild(document.createTextNode('Tocca '));
    p.appendChild(icona('condividi', 'ico-inline'));
    p.appendChild(document.createTextNode(' Condividi, poi “Aggiungi alla schermata Home”. Se sei dentro WhatsApp, apri prima il link in Safari.'));
  } else {
    p.textContent = 'La ritrovi tra le app, senza cercare il link ogni volta.';
  }
  t.appendChild(p);
  if (!iphone) {
    var b = el('button', 'btn', 'Installa');
    b.type = 'button';
    b.onclick = function () {
      var proposta = propostaInstallazione;
      if (!proposta) return;
      proposta.prompt();
      proposta.userChoice.then(function () {
        propostaInstallazione = null;
        box.remove();
      });
    };
    t.appendChild(b);
  }
  box.appendChild(t);

  var chiudi = el('button', 'installa-chiudi', '×');
  chiudi.type = 'button';
  chiudi.setAttribute('aria-label', 'Non mostrare più');
  chiudi.onclick = function () { scrivi(localStorage, 'invito-app-chiuso', '1'); box.remove(); };
  box.appendChild(chiudi);

  app.appendChild(box);
}

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  propostaInstallazione = e;
  if (!S.giorno && S.avvio) mostraDate();
});
window.addEventListener('appinstalled', function () {
  propostaInstallazione = null;
  scrivi(localStorage, 'invito-app-chiuso', '1');
  flash('App aggiunta al telefono', 'ok');
  if (!S.giorno && S.avvio) mostraDate();
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

function rigaData(d) {
  var liberi = Math.max(0, d.totale - d.occupati);
  var spenta = d.stato === 'chiusa' || d.passata;
  var r = el('button', 'riga');
  r.type = 'button';
  r.style.setProperty('--rientro', '64px');
  r.appendChild(anello(liberi, d.totale, spenta));

  var t = el('span', 'riga-testo');
  t.appendChild(el('span', 'riga-titolo', maiuscola(etichettaData(d.data))));
  var sotto;
  if (d.stato === 'chiusa') sotto = 'Prenotazioni chiuse';
  else if (d.passata) sotto = 'Data passata';
  else if (liberi === 0) sotto = 'Al completo';
  else sotto = plurale(liberi, 'orario libero', 'orari liberi') + ' su ' + d.totale;
  /* La nutrizionista non ha un orario fisso: lo scriviamo su ogni data */
  if (servizioDi(d) !== 'medica' && d.inizio) sotto = d.inizio + '–' + d.fine + ' · ' + sotto;
  var st = el('span', 'riga-sotto', sotto);
  t.appendChild(st);

  if (S.admin && d.perCanale) {
    var ripartizione = el('span', 'riga-sotto');

}

function anello(liberi, totale, spento) {
  var ns = 'http://www.w3.org/2000/svg';
  var C = 2 * Math.PI * 15;
  var frazione = totale ? liberi / totale : 0;
  var colore = spento || liberi === 0 ? 'var(--label-3)' : (liberi <= 3 ? 'var(--orange)' : 'var(--green)');

  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 36 36');
  svg.setAttribute('class', 'anello');
  svg.setAttribute('aria-hidden', 'true');

  var traccia = document.createElementNS(ns, 'circle');
  traccia.setAttribute('class', 'traccia');
  traccia.setAttribute('cx', '18'); traccia.setAttribute('cy', '18'); traccia.setAttribute('r', '15');
  svg.appendChild(traccia);

  if (frazione > 0) {
    var arco = document.createElementNS(ns, 'circle');
    arco.setAttribute('class', 'progresso');
    arco.setAttribute('cx', '18'); arco.setAttribute('cy', '18'); arco.setAttribute('r', '15');
    arco.setAttribute('stroke', colore);
    arco.setAttribute('stroke-dasharray', C.toFixed(2));
    arco.setAttribute('stroke-dashoffset', (C * (1 - frazione)).toFixed(2));
    arco.setAttribute('transform', 'rotate(-90 18 18)');
    svg.appendChild(arco);
  }

  var testo = document.createElementNS(ns, 'text');
  testo.setAttribute('x', '18'); testo.setAttribute('y', '18');
  testo.textContent = String(liberi);
  if (spento || liberi === 0) testo.setAttribute('style', 'fill: var(--label-3)');
  svg.appendChild(testo);
  return svg;
}

   Schermata: orari di una data
   ════════════════════════════════════════════════════════════════════ */
/* Ultimi orari visti per ogni data, per mostrarli subito mentre si aggiornano */
function chiaveOrari(data) { return 'orari:' + S.servizio + ':' + data; }
function leggiOrari(data) {
  try { var r = JSON.parse(sessionStorage.getItem(chiaveOrari(data))); return r && r.ok ? r : null; } catch (e) { return null; }
}
function salvaOrari(r) { try { sessionStorage.setItem(chiaveOrari(r.data), JSON.stringify(r)); } catch (e) {} }

function apriGiorno(data, daStoria) {
  S.giorno = data;
  S.slot = null;
  if (!daStoria) history.pushState({ giorno: data, servizio: S.servizio }, '');
  intestazioneGiorno(data);
  window.scrollTo(0, 0);
  var visti = S.admin ? null : (leggiOrari(data) || giornoProvvisorio(data));
  if (visti) { S.slot = visti; disegnaGiorno(visti); }
  else scheletroOrari();
  caricaGiorno(data);
}

/* La giornata ricostruita dall’elenco delle date, che porta già gli orari
   occupati: si vede subito, e intanto la pagina chiede a Google la versione
   aggiornata. Serve solo agli atleti (lo staff ha bisogno dei nomi). */
function giornoProvvisorio(data) {
  var d = (S.avvio && S.avvio.date || []).filter(function (x) {
    return x.data === data && servizioDi(x) === S.servizio;
  })[0];
  if (!d || !Array.isArray(d.prese)) return null;
  var o = d.inizio ? d : { inizio: S.avvio.oraInizio, fine: S.avvio.oraFine, durata: S.avvio.durata };
  var oggi = oggiISO(), adesso = new Date(), min = adesso.getHours() * 60 + adesso.getMinutes();
  return {
    ok: true, provvisorio: true, data: data, servizio: S.servizio,
    inizio: o.inizio, fine: o.fine, durata: o.durata,
    stato: d.stato, chiusa: d.stato === 'chiusa' || data < oggi,
    slot: slotDi(o).map(function (ora) {
      var occupato = d.prese.indexOf(ora) >= 0;
      return {
        ora: ora, occupato: occupato,
        passato: data < oggi || (data === oggi && minutiDi(ora) <= min),
        mia: occupato && !!leggiMia(data, ora)
      };
    })
  };
}

/* La giornata aggiornata arriva già nella risposta di prenota, annulla,
   sposta…: la si mostra senza rifare un’altra chiamata a Google. */
function usaGiorno(r) {
  if (!r || !r.ok || !r.slot || S.giorno !== r.data) return false;
  S.turnoGiorno++;   /* una lettura più vecchia ancora in viaggio non la sovrascrive */
  if (!S.admin) {
    r.slot.forEach(function (s) { if (!s.mia && leggiMia(r.data, s.ora)) scordaMia(r.data, s.ora); });
    salvaOrari(r);
  }
  S.slot = r;
  disegnaGiorno(r);
  return true;
}
function dopoScrittura(res, data) { if (!usaGiorno(res && res.giorno)) caricaGiorno(data); }

function caricaGiorno(data) {
  var turno = ++S.turnoGiorno;
  var bloccante = !S.slot;
  carico(1, bloccante);
  var richiesta = perServizio({ data: data });
  if (!S.admin) richiesta.mie = mieDellaData(data);
  return chiama('apiSlot', richiesta).then(function (r) {
    if (turno !== S.turnoGiorno || S.giorno !== data) return;
    if (!r.ok) { flash(r.errore, 'avviso'); history.back(); return; }
    /* Il server conferma quali orari sono davvero di questo telefono:
       dimentichiamo quelli annullati dallo staff o passati ad altri. */
    if (!S.admin) {
      r.slot.forEach(function (s) { if (!s.mia && leggiMia(data, s.ora)) scordaMia(data, s.ora); });
      salvaOrari(r);
    }
    S.slot = r;
    disegnaGiorno(r);
  }).catch(function () {
    if (turno !== S.turnoGiorno || S.giorno !== data) return;
    /* Se stiamo già mostrando gli ultimi orari visti, li lasciamo e avvisiamo */
    if (S.slot) { flash('Non riesco ad aggiornare gli orari: potrebbero non essere aggiornati.', 'avviso'); return; }
    var app = svuota($('app'));
    var bott = el('button', 'btn secondario', 'Riprova');
    bott.onclick = function () { scheletroOrari(); caricaGiorno(data); };
    app.appendChild(statoVuoto('avviso', 'Non riesco a caricare gli orari', 'Controlla la connessione e riprova.', bott));
  }).then(function () { carico(-1, bloccante); });
}

function scheletroOrari() {
  var app = svuota($('app'));
  app.appendChild(el('div', 'sezione', 'Scegli un orario'));
  var g = el('div', 'orari');
  for (var i = 0; i < 10; i++) {

}

function disegnaGiorno(r) {
  var liberi = r.slot.filter(function (s) { return !s.occupato && !s.passato; }).length;
  intestazioneGiorno(r.data, r.chiusa
    ? (r.stato === 'chiusa' ? 'Prenotazioni chiuse' : 'Data passata')
    : plurale(liberi, 'orario libero', 'orari liberi') + ' su ' + r.slot.length + ' · ' + SV().unita + ' da ' + durata() + ' minuti');

  var app = svuota($('app'));
  if (S.admin) { disegnaGiornoStaff(app, r); return; }

  if (r.chiusa) {
    app.appendChild(avviso('avviso', r.stato === 'chiusa'
      ? 'Le prenotazioni per questa data sono chiuse. Per informazioni rivolgiti allo staff.'
      : 'Questa data è già passata.'));
  }

  var mia = r.slot.filter(function (s) { return s.mia; })[0];
  if (mia) {
    app.appendChild(avviso('info', 'Sei prenotato alle ' + mia.ora + '. Tocca il tuo orario per vedere il codice o annullare.'));
  }

  app.appendChild(el('div', 'sezione', 'Scegli un orario'));
  var griglia = el('div', 'orari');
  r.slot.forEach(function (s) { griglia.appendChild(pastigliaOrario(r, s)); });
  app.appendChild(griglia);
  app.appendChild(el('p', 'nota-sezione', 'Gli orari barrati sono già presi. In blu, il tuo.'));
}

function pastigliaOrario(r, s) {
  var b = el('button', 'orario');

  } else if (s.occupato) {
    b.classList.add('preso');
    stato = 'Occupato';
    b.disabled = true;
  } else if (s.passato || r.chiusa) {
    b.classList.add('fuori');
    stato = s.passato ? 'Passato' : 'Chiuso';
    b.disabled = true;
  } else {
    b.classList.add('libero');
    stato = 'Libero';
    b.onclick = function () { foglioPrenota(r, s); };
  }
  b.appendChild(el('b', null, s.ora));

  b.setAttribute('aria-label', s.ora + ', ' + stato);

}

function apriFoglio(costruisci) {
  var mod = $('modale');
  var velo = mod.firstChild, foglio;
  if (velo) {
    foglio = svuota(velo.firstChild);   /* cambio contenuto: il foglio resta aperto */
  } else {
    S.fuoco = document.activeElement;
    velo = el('div', 'velo');

    foglio.setAttribute('role', 'dialog');
    foglio.setAttribute('aria-modal', 'true');
    velo.appendChild(foglio);
    velo.addEventListener('click', function (e) { if (e.target === velo) chiudiFoglio(); });
    mod.appendChild(velo);
    document.documentElement.classList.add('bloccato');

  foglio.scrollTop = 0;
  foglio.appendChild(el('div', 'maniglia'));
  costruisci(foglio);

function foglioPrenota(r, s) {

     il server riconosce la stessa richiesta e non crea doppioni. */

        };
        bottoniTipo[k] = b;
        sceltaTipo.appendChild(b);
      });
      f.appendChild(sceltaTipo);
    }

    f.appendChild(el('div', 'sezione', 'Sono un atleta di'));
    var scelta = el('div', 'scelta');
    scelta.setAttribute('role', 'radiogroup');
    scelta.setAttribute('aria-label', 'Società');
    var opzioni = {};
    Object.keys(CANALI).forEach(function (k) {

        canale = k;
        Object.keys(opzioni).forEach(function (j) { opzioni[j].setAttribute('aria-checked', j === k ? 'true' : 'false'); });
        errore.nascondi();
      };
      opzioni[k] = o;
      scelta.appendChild(o);
    });
    f.appendChild(scelta);

    f.appendChild(el('div', 'sezione', S.admin ? 'Dati dell’atleta' : 'I tuoi dati'));
    var g = el('div', 'gruppo');
    var iNome = campo(g, 'Nome', 'text', 'given-name', 'Obbligatorio');
    var iCognome = campo(g, 'Cognome', 'text', 'family-name', 'Obbligatorio');
    var iTel = campo(g, 'Telefono', 'tel', 'tel', 'Obbligatorio');
    f.appendChild(g);
    f.appendChild(el('p', 'nota-sezione', 'Il nome lo vede solo lo staff, che userà il telefono per avvisarti se qualcosa cambia.'));

    var errore = erroreInline(f);
    var pila = el('div', 'pila');
    var bott = el('button', 'btn', (S.admin ? 'Inserisci alle ' : 'Prenota alle ') + s.ora);
    bott.type = 'button';
    pila.appendChild(bott);
    f.appendChild(pila);

    function invia() {
      errore.nascondi();
      var dati = {
        data: r.data, ora: s.ora, canale: canale, codice: codice, servizio: S.servizio, tipo: tipo,
        nome: iNome.value.trim(), cognome: iCognome.value.trim(), telefono: iTel.value.trim()
      };
      if (sceltaTipo && !tipo) { errore.mostra('Indica se è la prima visita o un controllo.'); sceltaTipo.classList.add('scuoti'); setTimeout(function () { sceltaTipo.classList.remove('scuoti'); }, 450); return; }
      if (!canale) { errore.mostra('Scegli la tua società.'); scelta.classList.add('scuoti'); setTimeout(function () { scelta.classList.remove('scuoti'); }, 450); return; }
      if (!dati.nome || !dati.cognome) { errore.mostra('Servono nome e cognome.'); (dati.nome ? iCognome : iNome).focus(); return; }
      if (dati.telefono.replace(/\D/g, '').length < 8) { errore.mostra('Inserisci un numero di telefono valido.'); iTel.focus(); return; }

      occupa(bott, true, 'Prenoto…');
      /* Lo staff riceve la giornata con i nomi; l’atleta manda i codici che il
         telefono ricorda, per vedere in blu anche le altre sue prenotazioni */
      if (S.admin) conPin(dati); else dati.mie = mieDellaData(r.data);
      attendi(chiama('apiPrenota', dati)).then(function (res) {
        if (!res.ok) {
          occupa(bott, false);
          errore.mostra(res.errore);
          if (res.ricarica) caricaGiorno(r.data);
          return;
        }
        S.canale = canale;
        if (!S.admin) {
          scrivi(localStorage, 'canale', canale);
          salvaMia(r.data, s.ora, res.codice);
          foglioConfermato(r, s, res.codice);
        } else {
          chiudiFoglio();
          flash('Prenotazione inserita', 'ok');
        }
        dopoScrittura(res, r.data);
      }).catch(function () {
        occupa(bott, false);
        errore.mostra('Non riesco a confermare la prenotazione: Google non risponde. Premi di nuovo “Prenota”: se era già registrata te lo confermo, senza creare doppioni.');
      });
    }
    bott.onclick = invia;
    [iNome, iCognome, iTel].forEach(function (i) {
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); invia(); } });
    });
  });
}

/* Evento .ics con promemoria il giorno prima. Orario "fluttuante": il telefono
   lo legge nel proprio fuso, che per chi è qui è quello italiano. */
function scaricaCalendario(data, ora, codice) {
  var p = ora.split(':');
  var inizio = +p[0] * 60 + +p[1], fine = inizio + durata();
  var giorno = data.replace(/-/g, '');
  var hhmm = function (m) { return due(Math.floor(m / 60)) + due(m % 60) + '00'; };
  var adesso = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  var ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ASD Power Gym Passignano//Prenotazioni//IT', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + data + '-' + ora.replace(':', '') + '-' + codice + '@prenotazioni-visite',
    'DTSTAMP:' + adesso,
    'DTSTART:' + giorno + 'T' + hhmm(inizio),
    'DTEND:' + giorno + 'T' + hhmm(fine),
    'SUMMARY:' + SV().evento,
    'DESCRIPTION:Codice prenotazione: ' + codice,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Domani ' + SV().evento.toLowerCase(), 'TRIGGER:-P1D', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  var url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  var a = el('a');
  a.href = url;
  a.download = SV().file + '-' + data + '.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
}

      occupa(bott, true, 'Sposto…');

/* Inizio, fine e durata di una giornata, con l’anteprima degli orari che ne escono */
var DURATE = [10, 15, 20, 30, 40, 45, 60, 90];

function campiOrari(f, valori) {
  var g = el('div', 'gruppo');
  var iInizio = campo(g, 'Inizio', 'time');
  var iFine = campo(g, 'Fine', 'time');
  iInizio.step = iFine.step = 300;
  iInizio.value = valori.inizio || '';
  iFine.value = valori.fine || '';

  var cDurata = el('label', 'campo');
  cDurata.appendChild(el('span', null, 'Durata'));
  var selDurata = el('select');
  var durate = DURATE.slice();
  if (valori.durata && durate.indexOf(+valori.durata) < 0) durate.push(+valori.durata);
  durate.sort(function (a, b) { return a - b; }).forEach(function (m) {
    var o = el('option', null, m + ' minuti');
    o.value = String(m);
    if (m === +valori.durata) o.selected = true;
    selDurata.appendChild(o);
  });
  cDurata.appendChild(selDurata);
  g.appendChild(cDurata);
  f.appendChild(g);

  var nota = el('p', 'nota-sezione', '');
  f.appendChild(nota);

  function leggiValori() { return { inizio: iInizio.value, fine: iFine.value, durata: +selDurata.value }; }
  function anteprima() {
    var lista = slotDi(leggiValori());
    if (!lista.length) { nota.textContent = 'Con questi orari non c’entra nessun appuntamento.'; return; }
    nota.textContent = plurale(lista.length, 'appuntamento', 'appuntamenti') + ': ' +
      (lista.length > 4 ? lista.slice(0, 3).join(', ') + ' … ' + lista[lista.length - 1] : lista.join(', ')) + '.';
  }
  [iInizio, iFine, selDurata].forEach(function (i) { i.addEventListener('input', anteprima); i.addEventListener('change', anteprima); });
  anteprima();
  return { valori: leggiValori, nota: nota };
}

function piuGiorni(iso, n) {
  var d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + due(d.getMonth() + 1) + '-' + due(d.getDate());
}

var pdfPronto = null;
function caricaJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if (pdfPronto) return pdfPronto;
  pdfPronto = new Promise(function (ok, no) {
    var s = el('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ok;
    s.onerror = function () { pdfPronto = null; no(new Error('libreria PDF')); };
    document.head.appendChild(s);
  });
  return pdfPronto;
}

/* I caratteri base del PDF coprono l'italiano; lettere più rare (ğ, ł…) diventano
   la lettera base, così un nome straniero non esce illeggibile. */
function perPDF(t) {
  return String(t == null ? '' : t).replace(/[^\u0000-ÿ]/g, function (c) {
    var base = c.normalize ? c.normalize('NFD').charAt(0) : c;
    return base.charCodeAt(0) <= 255 ? base : '?';
  });
}

/* Prima di accorciare un testo si prova a rimpicciolirlo, fino a un minimo:
   un numero di telefono tagliato non servirebbe al medico. */
function rimpicciolisci(doc, t, larghezza, massimo, minimo) {
  var dim = massimo;
  doc.setFontSize(dim);
  while (dim > minimo && doc.getTextWidth(t) > larghezza) { dim -= 0.5; doc.setFontSize(dim); }
}

function taglia(doc, t, larghezza) {
  if (doc.getTextWidth(t) <= larghezza) return t;
  while (t.length > 1 && doc.getTextWidth(t + '...') > larghezza) t = t.slice(0, -1);
  return t + '...';
}

/* I loghi arrivano come SVG o JPEG: li passo da una tela e li salvo in JPEG,
   nitidi ma leggeri, così il PDF si manda facilmente anche su WhatsApp */
function logoPerPDF(src) {
  return new Promise(function (ok, no) {
    var rapporto = 0;
    if (src.indexOf('data:image/svg+xml;base64,') === 0) {
      try {
        var vb = atob(src.split(',')[1]).match(/viewBox="\s*[\d.\-]+[\s,]+[\d.\-]+[\s,]+([\d.]+)[\s,]+([\d.]+)/);
        if (vb) rapporto = parseFloat(vb[1]) / parseFloat(vb[2]);
      } catch (e) {}
    }
    var img = new Image();
    img.onload = function () {
      var r = rapporto || (img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 2);
      var altezza = 200, larghezza = Math.round(altezza * r);
      var tela = el('canvas');
      tela.width = larghezza;
      tela.height = altezza;
      var ctx = tela.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, larghezza, altezza);
      ctx.drawImage(img, 0, 0, larghezza, altezza);
      ok({ dati: tela.toDataURL('image/jpeg', 0.9), rapporto: r });
    };
    img.onerror = function () { no(new Error('logo')); };
    img.src = src;
  });
}

var COLORE_PDF = { powergym: [229, 72, 77], trasimenoflippers: [255, 149, 0] };

function creaPDF(r, avvio) {
  var chiavi = Object.keys(CANALI);
  return Promise.all(chiavi.map(function (k) {
    return LOGHI[k] ? logoPerPDF(LOGHI[k]).catch(function () { return null; }) : Promise.resolve(null);
  })).then(function (loghi) {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    var M = 16, L = 210 - 2 * M, y = M;
    var dataLunga = new Date(r.data + 'T12:00:00').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var sv = SERVIZI[r.servizio] || SERVIZI.medica;
    var conTipo = r.servizio === 'nutrizionista';
    /* Titolo del documento: è quello che il visualizzatore mostra al posto di un codice */
    doc.setProperties({
      title: perPDF(sv.titolo + ' - ' + maiuscola(dataLunga)),
      subject: perPDF('Prenotazioni - ' + sv.titolo),
      author: 'ASD Power Gym Passignano',
      creator: 'Prenotazioni visite mediche'
    });
    doc.setDisplayMode('fullwidth', 'continuous');

    /* Intestazione: titolo a sinistra, loghi a destra */
    var xLogo = 210 - M;
    loghi.slice().reverse().forEach(function (lg) {
      if (!lg) return;
      var hL = 14, wL = Math.min(hL * lg.rapporto, 34);
      xLogo -= wL;
      doc.addImage(lg.dati, 'JPEG', xLogo, y - 2, wL, wL / lg.rapporto);
      xLogo -= 4;
    });
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.setTextColor(0);
    doc.text(perPDF(sv.titolo), M, y + 5);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(13);
    doc.text(perPDF(maiuscola(dataLunga)), M, y + 12);
    doc.setFontSize(9.5);
    doc.setTextColor(110);
    doc.text(perPDF('Dalle ' + (r.inizio || avvio.oraInizio) + ' alle ' + (r.fine || avvio.oraFine) +
      '  ·  ' + sv.unita + ' da ' + (r.durata || avvio.durata || 15) + ' minuti'), M, y + 17.5);
    y += 24;
    doc.setDrawColor(215);
    doc.setLineWidth(0.3);
    doc.line(M, y, 210 - M, y);
    y += 8;

    /* Riepilogo */
    var occupati = r.slot.filter(function (s) { return s.occupato; });
    var parti = ['Prenotati: ' + occupati.length + ' su ' + r.slot.length];
    chiavi.forEach(function (k) {
      parti.push(CANALI[k] + ': ' + occupati.filter(function (s) { return s.canale === k; }).length);
    });
    doc.setFontSize(10.5);
    doc.setTextColor(40);
    doc.text(perPDF(parti.join('     ')), M, y);
    y += 6;

    /* Tabella */
    var col = conTipo ? [
      { k: 'ora', t: 'Ora', w: 15 }, { k: 'nome', t: 'Cognome e nome', w: 41 }, { k: 'soc', t: 'Società', w: 38 },
      { k: 'tel', t: 'Telefono', w: 26 }, { k: 'tipo', t: 'Tipo', w: 22 }, { k: 'pres', t: 'Presente', w: 19 }, { k: 'note', t: 'Note', w: 17 }
    ] : [
      { k: 'ora', t: 'Ora', w: 16 }, { k: 'nome', t: 'Cognome e nome', w: 52 }, { k: 'soc', t: 'Società', w: 36 },
      { k: 'tel', t: 'Telefono', w: 30 }, { k: 'pres', t: 'Presente', w: 18 }, { k: 'note', t: 'Note', w: 26 }
    ];
    /* Posizione e larghezza di ogni colonna, per nome */
    var C = {}, xc = M;
    col.forEach(function (c) { C[c.k] = { x: xc, w: c.w }; xc += c.w; });
    var hTesta = 8, hRiga = 11.5, x;
    function testaTabella() {
      doc.setFillColor(242, 242, 247);
      doc.rect(M, y, L, hTesta, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.setTextColor(95);
      x = M;
      col.forEach(function (c) { doc.text(perPDF(c.t.toUpperCase()), x + 2.5, y + 5.3); x += c.w; });
      y += hTesta;
    }
    testaTabella();

    r.slot.forEach(function (s, i) {
      /* Giornate lunghe (la nutrizionista può ricevere tutto il giorno): si va a pagina nuova */
      if (y + hRiga > 297 - 24) { doc.addPage(); y = M; testaTabella(); }
      if (i % 2 === 1) { doc.setFillColor(250, 250, 252); doc.rect(M, y, L, hRiga, 'F'); }
      var yt = y + hRiga / 2 + 1.4;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(s.occupato ? 0 : 165);
      doc.text(s.ora, C.ora.x + 2.5, yt);
      if (s.occupato) {
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(0);
        var nomeCompleto = perPDF(((s.cognome || '') + ' ' + (s.nome || '')).trim() || 'Senza nome');
        rimpicciolisci(doc, nomeCompleto, C.nome.w - 4, 11, 9);
        doc.text(taglia(doc, nomeCompleto, C.nome.w - 4), C.nome.x + 2.5, yt);
        x = C.soc.x;
        var rgb = COLORE_PDF[s.canale] || [160, 160, 160];
        doc.setFillColor(rgb[0], rgb[1], rgb[2]);
        doc.circle(x + 3.6, yt - 1.25, 1.15, 'F');
        doc.setFontSize(9.5);
        doc.setTextColor(60);
        doc.text(taglia(doc, perPDF(CANALI[s.canale] || '-'), C.soc.w - 8), x + 6.8, yt);
        doc.setTextColor(40);
        var tel = perPDF(s.telefono || '');
        rimpicciolisci(doc, tel, C.tel.w - 3, 10, 7.5);
        doc.text(taglia(doc, tel, C.tel.w - 3), C.tel.x + 2.5, yt);
        if (C.tipo) {
          doc.setFontSize(9.5);
          doc.setTextColor(40);
          doc.text(taglia(doc, perPDF(TIPI[s.tipo] || '-'), C.tipo.w - 3), C.tipo.x + 2.5, yt);
        }
        doc.setDrawColor(140);
        doc.setLineWidth(0.35);
        doc.rect(C.pres.x + C.pres.w / 2 - 2.3, yt - 3.7, 4.6, 4.6);
      } else {
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(10);
        doc.setTextColor(175);
        doc.text('libero', C.nome.x + 2.5, yt);
      }
      doc.setDrawColor(228);
      doc.setLineWidth(0.2);
      doc.line(M, y + hRiga, M + L, y + hRiga);
      y += hRiga;
    });

    /* Piè di pagina */
    var adesso = new Date();
    var generato = adesso.toLocaleDateString('it-IT') + ' alle ' + due(adesso.getHours()) + ':' + due(adesso.getMinutes());
    var pagine = doc.getNumberOfPages();
    for (var n = 1; n <= pagine; n++) {
      doc.setPage(n);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      doc.setTextColor(120);
      doc.text('Documento riservato: contiene dati personali degli atleti. Da consegnare solo ' + sv.destinatario + '.', M, 297 - 17);
      doc.text(perPDF('ASD Power Gym Passignano · TrasimenoFlippers   -   Generato il ' + generato), M, 297 - 12);
      if (pagine > 1) doc.text('Pagina ' + n + ' di ' + pagine, 210 - M, 297 - 12, { align: 'right' });
    }
    return doc.output('blob');
  });
}

          try { file = new File([x.blob], nome, { type: 'application/pdf' }); } catch (err) {}

          pila.appendChild(scarica);
          var stampa = bottoneIcona('tabella', 'Apri per stampare', 'btn secondario');
          stampa.onclick = function () { window.open(url, '_blank'); };
          pila.appendChild(stampa);

        .catch(function (err) {
          svuota(pila);

            ? 'Non riesco a caricare il generatore di PDF. Controlla la connessione.'

          riprova.type = 'button';

          pila.appendChild(riprova);

    prepara();
  });
}

      if (navigator.share) {
        var cond = el('button', 'btn secondario');
        cond.type = 'button';
        cond.appendChild(icona('condividi', 'ico'));
        cond.appendChild(document.createTextNode('Condividi'));
        cond.onclick = function () {
          navigator.share(nutri()
            ? { title: 'Prenota la nutrizionista', text: 'Prenota qui il tuo appuntamento con la nutrizionista:', url: v.url }
            : { title: 'Prenota la visita medica', text: 'Prenota qui il tuo orario per la visita medica sportiva:', url: v.url }
          ).catch(function () {});
        };
        azioni.appendChild(cond);
      }
      box.appendChild(azioni);
      f.appendChild(box);

      caricaQR().then(function () {
        new QRCode(tela, { text: v.url, width: 176, height: 176, correctLevel: QRCode.CorrectLevel.M });
      }).catch(function () { tela.remove(); });
    });
  });
}

/* ── Area staff ───────────────────────────────────────────────────── */
function foglioPin() {
  apriFoglio(function (f) {
    var entra = el('button', 'link', 'Entra');
    entra.type = 'button';
    testaFoglio(f, 'Area staff', 'Annulla', entra);

    var e = el('div', 'esito');
    var lucchetto = icona('lucchetto', 'cerchio');
    lucchetto.style.background = 'var(--tint)';
    lucchetto.style.animation = 'none';
    e.appendChild(lucchetto);
    e.appendChild(el('h2', null, 'Accesso staff'));
    e.appendChild(el('p', null, 'Inserisci il PIN per vedere i nomi e gestire le date.'));
    f.appendChild(e);

    var g = el('div', 'gruppo');
    g.style.marginTop = '22px';
    var input = campo(g, 'PIN', 'password', 'current-password', 'Obbligatorio');
    input.inputMode = 'numeric';
    f.appendChild(g);
    var errore = erroreInline(f);

    function prova() {
      var pin = input.value.trim();
      if (!pin) { input.focus(); return; }
      errore.nascondi();
      entra.disabled = true;
      entra.textContent = 'Verifico…';
      attendi(chiama('apiAvvio', { pin: pin, v: 3 })).then(function (r) {
        if (!r.admin) {
          entra.disabled = false;
          entra.textContent = 'Entra';
          errore.mostra('PIN non corretto.');
          g.classList.add('scuoti');
          setTimeout(function () { g.classList.remove('scuoti'); }, 450);
          input.select();
          return;
        }
        S.pin = pin;
        scrivi(sessionStorage, 'pin', pin);
        applicaAvvio(r);
        chiudiFoglio();
        flash('Benvenuto nell’area staff', 'ok');
        if (S.giorno) caricaGiorno(S.giorno); else mostraDate();
      }).catch(function (err) {
        entra.disabled = false;
        entra.textContent = 'Entra';
        errore.mostra(testoErrore(err));
      });
    }
    entra.onclick = prova;
    input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); prova(); } });
    setTimeout(function () { input.focus(); }, 60);
  });
}

$('btn-staff').onclick = function () {
  if (!S.admin) { foglioPin(); return; }
  S.pin = '';
  S.admin = false;
  scrivi(sessionStorage, 'pin', null);
  flash('Sei uscito dall’area staff', 'ok');
  if (S.giorno) history.back();
  else { scheletroDate(); aggiornaAvvio(); }
};

/* ════════════════════════════════════════════════════════════════════
   Navigazione: il tasto Indietro (anche quello di Android) torna alle date
   o chiude il foglio aperto, invece di uscire dalla pagina.
   ════════════════════════════════════════════════════════════════════ */
function tornaDate() {
  S.turnoGiorno++;
  S.giorno = null;
  S.slot = null;
  if (S.avvio) mostraDate(); else scheletroDate();
  window.scrollTo(0, 0);
  aggiornaAvvio();
}

window.addEventListener('popstate', function () {
  if ($('modale').firstChild) {
    chiudiFoglio();
    if (S.giorno) history.pushState({ giorno: S.giorno }, '');
    return;
  }
  if (S.giorno) tornaDate();
});

$('nav-indietro').onclick = function () { history.back(); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') chiudiFoglio(); });
window.addEventListener('scroll', function () {
  $('nav').classList.toggle('solida', window.scrollY > 40);
}, { passive: true });

/* ════════════════════════════════════════════════════════════════════
   Avvio: si mostra subito l’ultima versione vista, poi si aggiorna.
   ════════════════════════════════════════════════════════════════════ */
history.replaceState({ home: true }, '');
(function () {
  var cache = S.pin ? null : leggiCache();
  if (cache) { applicaAvvio(cache); mostraDate(); }
  else { intestazioneHome(); scheletroDate(); }
  aggiornaAvvio();
})();
</script>
