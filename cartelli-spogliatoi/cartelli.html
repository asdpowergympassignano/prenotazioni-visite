<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Cartelli Spogliatoi</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --gold: #D4A537; --gold-light: #F3D27A; --ink: #0B0B0C; }
  body { background: #444; font-family: 'Oswald', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .page {
    width: 210mm; height: 297mm; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #26221a 0%, var(--ink) 62%);
    color: #fff; page-break-after: always; break-after: page;
    display: flex; flex-direction: column; align-items: center;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* cornice doppia */
  .frame { position: absolute; inset: 9mm; border: 1.2mm solid var(--gold); }
  .frame::after { content: ""; position: absolute; inset: 2.5mm; border: 0.4mm solid var(--gold); opacity: .7; }

  /* righe diagonali sottili sullo sfondo */
  .stripes {
    position: absolute; inset: 0; opacity: .05;
    background: repeating-linear-gradient(135deg, #fff 0 1px, transparent 1px 14px);
  }

  .brand { position: relative; margin-top: 20mm; text-align: center; }
  .brand .crest { width: 34mm; height: 34mm; display: block; margin: 0 auto 4mm; }
  .brand .name {
    font-family: 'Anton', sans-serif; font-size: 15mm; letter-spacing: 1.2mm; line-height: 1;
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, #9c7420);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .sub { font-weight: 600; font-size: 6.2mm; letter-spacing: 3.2mm; margin-top: 2mm; color: #fff; }

  .divider { position: relative; display: flex; align-items: center; gap: 4mm; margin: 7mm 0 5mm; width: 140mm; }
  .divider span { flex: 1; height: 0.5mm; background: linear-gradient(90deg, transparent, var(--gold)); }
  .divider span:last-child { background: linear-gradient(90deg, var(--gold), transparent); }
  .divider b { color: var(--gold); font-size: 6mm; }

  .label { position: relative; font-weight: 400; letter-spacing: 4mm; font-size: 8mm; color: #cfcfcf; }

  .figure { position: relative; height: 74mm; margin: 6mm 0 5mm; }
  .figure svg { height: 100%; }

  .big {
    position: relative; font-family: 'Anton', sans-serif; font-size: 40mm; line-height: 1;
    letter-spacing: 2mm; color: #fff; text-shadow: 0 1.5mm 0 var(--gold);
  }

  .motto {
    position: absolute; bottom: 22mm; left: 0; right: 0; text-align: center;
    font-weight: 600; font-size: 6mm; letter-spacing: 1.6mm; color: var(--gold);
  }
  .motto small { display: block; margin-top: 2mm; font-weight: 400; font-size: 4mm; letter-spacing: 1.2mm; color: #9a9a9a; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D27A"/><stop offset=".6" stop-color="#D4A537"/><stop offset="1" stop-color="#9c7420"/>
    </linearGradient>
    <!-- stemma: alloro + manubrio + stella -->
    <symbol id="crest" viewBox="0 0 120 120">
      <g fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round">
        <path d="M34 100 C14 84 10 58 22 32"/>
        <path d="M86 100 C106 84 110 58 98 32"/>
      </g>
      <g fill="url(#g)">
        <ellipse cx="17" cy="78" rx="4" ry="8" transform="rotate(-40 17 78)"/>
        <ellipse cx="13" cy="62" rx="4" ry="8" transform="rotate(-15 13 62)"/>
        <ellipse cx="14" cy="46" rx="4" ry="8" transform="rotate(10 14 46)"/>
        <ellipse cx="27" cy="90" rx="4" ry="8" transform="rotate(-62 27 90)"/>
        <ellipse cx="103" cy="78" rx="4" ry="8" transform="rotate(40 103 78)"/>
        <ellipse cx="107" cy="62" rx="4" ry="8" transform="rotate(15 107 62)"/>
        <ellipse cx="106" cy="46" rx="4" ry="8" transform="rotate(-10 106 46)"/>
        <ellipse cx="93" cy="90" rx="4" ry="8" transform="rotate(62 93 90)"/>
        <!-- manubrio -->
        <rect x="32" y="60" width="56" height="5" rx="2"/>
        <rect x="30" y="49" width="7" height="27" rx="2"/>
        <rect x="83" y="49" width="7" height="27" rx="2"/>
        <rect x="23" y="53" width="6" height="19" rx="2"/>
        <rect x="91" y="53" width="6" height="19" rx="2"/>
        <!-- stella -->
        <path d="M60 14 l5.3 10.8 11.9 1.7 -8.6 8.4 2 11.8 -10.6 -5.6 -10.6 5.6 2 -11.8 -8.6 -8.4 11.9 -1.7z"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- ================= UOMINI ================= -->
<section class="page">
  <div class="stripes"></div>
  <div class="frame"></div>
  <div class="brand">
    <svg class="crest"><use href="#crest"/></svg>
    <div class="name">PASSIGNANO</div>
    <div class="sub">FITNESS LEGENDS</div>
  </div>
  <div class="divider"><span></span><b>★</b><span></span></div>
  <div class="label">SPOGLIATOIO</div>
  <div class="figure">
    <svg viewBox="0 0 100 200">
      <g fill="url(#g)">
        <circle cx="50" cy="20" r="15"/>
        <rect x="27" y="40" width="46" height="70" rx="10"/>
        <rect x="11" y="40" width="13" height="64" rx="6.5"/>
        <rect x="76" y="40" width="13" height="64" rx="6.5"/>
        <rect x="29" y="102" width="19" height="94" rx="9.5"/>
        <rect x="52" y="102" width="19" height="94" rx="9.5"/>
      </g>
    </svg>
  </div>
  <div class="big">UOMINI</div>
  <div class="motto">ENTRI COME SEI. ESCI DA LEGGENDA.<small>#PASSIGNANOFITNESSLEGENDS</small></div>
</section>

<!-- ================= DONNE ================= -->
<section class="page">
  <div class="stripes"></div>
  <div class="frame"></div>
  <div class="brand">
    <svg class="crest"><use href="#crest"/></svg>
    <div class="name">PASSIGNANO</div>
    <div class="sub">FITNESS LEGENDS</div>
  </div>
  <div class="divider"><span></span><b>★</b><span></span></div>
  <div class="label">SPOGLIATOIO</div>
  <div class="figure">
    <svg viewBox="0 0 100 200">
      <g fill="url(#g)">
        <circle cx="50" cy="20" r="15"/>
        <path d="M38 40 H62 C68 40 71 44 72 50 L88 128 C89 132 87 134 83 134 H17 C13 134 11 132 12 128 L28 50 C29 44 32 40 38 40Z"/>
        <rect x="9" y="42" width="12" height="58" rx="6" transform="rotate(12 15 42)"/>
        <rect x="79" y="42" width="12" height="58" rx="6" transform="rotate(-12 85 42)"/>
        <rect x="32" y="128" width="15" height="68" rx="7.5"/>
        <rect x="53" y="128" width="15" height="68" rx="7.5"/>
      </g>
    </svg>
  </div>
  <div class="big">DONNE</div>
  <div class="motto">ENTRI COME SEI. ESCI DA LEGGENDA.<small>#PASSIGNANOFITNESSLEGENDS</small></div>
</section>

</body>
</html>
